    <style>:root{--bg-dark:#090d16;--sidebar-bg:#0f172a;--card-bg:rgba(30,41,59,0.85);--card-border:rgba(255,255,255,0.12);--accent-blue:#38bdf8;--accent-emerald:#10b981;--accent-purple:#c084fc;--accent-rose:#f43f5e;--accent-amber:#f59e0b;--text-main:#f8fafc;--text-muted:#cbd5e1}*{box-sizing:border-box}body{background:radial-gradient(circle at top right,#1e1b4b 0%,#090d16 60%,#030712 100%);color:var(--text-main);font-family:'Cairo',sans-serif;min-height:100vh;margin:0;overflow-x:hidden}.top-header{background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);padding:0.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:sticky;top:0;z-index:1050}.brand-box{display:flex;align-items:center;gap:0.7rem}.brand-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;box-shadow:0 4px 14px rgba(124,58,237,0.4)}.brand-name{font-weight:800;font-size:1.15rem;margin:0;letter-spacing:0.5px}.brand-sub{font-size:0.72rem;color:var(--text-muted);margin:0}.conn-indicator{display:inline-flex;align-items:center;gap:0.45rem;font-size:0.8rem;font-weight:600;padding:0.35rem 0.8rem;border-radius:20px;border:1px solid;transition:all 0.3s;white-space:nowrap}.conn-ok{color:var(--accent-emerald);border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.1)}.conn-bad{color:var(--accent-rose);border-color:rgba(244,63,94,0.4);background:rgba(244,63,94,0.1)}.conn-checking{color:var(--accent-amber);border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.1)}.pulse-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.conn-ok .pulse-dot{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}.app-shell{display:flex;height:calc(100vh - 66px);max-width:1500px;margin:0 auto}.chat-sidebar{width:270px;background:rgba(15,23,42,0.95);border-left:1px solid var(--card-border);display:flex;flex-direction:column;flex-shrink:0;transition:margin 0.3s ease}.chat-sidebar.hidden{margin-right:-270px}.sidebar-header{padding:1rem;border-bottom:1px solid var(--card-border)}.btn-new-chat{width:100%;background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border:none;border-radius:10px;padding:0.6rem;font-weight:700;font-size:0.9rem;transition:all 0.2s;font-family:'Cairo',sans-serif}.btn-new-chat:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,0.4)}.sessions-list{flex:1;overflow-y:auto;padding:0.7rem}.session-item{padding:0.65rem 0.85rem;border-radius:10px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;font-size:0.85rem;margin-bottom:0.35rem;border:1px solid transparent;transition:all 0.2s}.session-item:hover{background:rgba(255,255,255,0.07);color:#fff}.session-item.active{background:rgba(56,189,248,0.15);color:var(--accent-blue);border-color:rgba(56,189,248,0.35)}.session-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.session-del{background:none;border:none;color:rgba(244,63,94,0.6);font-size:0.75rem;padding:2px 5px;border-radius:4px;opacity:0;transition:all 0.2s}.session-item:hover .session-del{opacity:1}.session-del:hover{color:var(--accent-rose);background:rgba(244,63,94,0.15)}.sidebar-footer{padding:0.8rem 1rem;border-top:1px solid var(--card-border);font-size:0.72rem;color:var(--text-muted);text-align:center}.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}.chat-messages{flex:1;padding:1.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.3rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent}.chat-messages::-webkit-scrollbar{width:6px}.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}.msg-row{display:flex;gap:0.8rem;animation:fadeIn 0.3s ease;max-width:92%}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.msg-row.user{align-self:flex-start}.msg-row.assistant{align-self:flex-start;width:92%}.avatar-box{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;margin-top:2px}.avatar-user{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff}.avatar-ai{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}.msg-body{display:flex;flex-direction:column;gap:0.35rem;min-width:0;flex:1}.msg-sender{font-size:0.75rem;font-weight:700;color:var(--text-muted)}.msg-bubble{padding:0.95rem 1.15rem;border-radius:14px;font-size:0.92rem;line-height:1.75;word-break:break-word;overflow-wrap:break-word}.user .msg-bubble{background:linear-gradient(135deg,#0369a1 0%,#1e40af 100%);color:#fff;border-top-right-radius:4px}.assistant .msg-bubble{background:rgba(30,41,59,0.9);border:1px solid var(--card-border);border-top-left-radius:4px}.msg-bubble p{margin:0 0 0.5rem}.msg-bubble p:last-child{margin-bottom:0}.msg-bubble ul,.msg-bubble ol{padding-right:1.2rem;margin:0.4rem 0}.msg-bubble a{color:var(--accent-blue);text-decoration:none}.msg-bubble a:hover{text-decoration:underline}.msg-bubble table{border-collapse:collapse;width:100%;margin:0.6rem 0;font-size:0.85rem}.msg-bubble th,.msg-bubble td{border:1px solid rgba(255,255,255,0.15);padding:0.45rem 0.7rem;text-align:right}.msg-bubble th{background:rgba(255,255,255,0.07)}.msg-bubble blockquote{border-right:3px solid var(--accent-blue);padding-right:0.9rem;margin:0.5rem 0;color:var(--text-muted)}pre{background:#0d1117 !important;border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:1rem;margin:0.7rem 0;overflow-x:auto;position:relative;direction:ltr;text-align:left}pre code{font-family:'Fira Code',Consolas,Monaco,monospace;font-size:0.85rem}.code-copy-btn{position:absolute;top:8px;left:8px;background:rgba(255,255,255,0.1);border:none;color:#cbd5e1;font-size:0.72rem;padding:3px 10px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity 0.2s;font-family:'Cairo',sans-serif}pre:hover .code-copy-btn{opacity:1}.code-copy-btn:hover{background:rgba(255,255,255,0.2);color:#fff}.typing-cursor{display:inline-block;width:8px;height:1.1em;background:var(--accent-blue);border-radius:2px;animation:blink 1s infinite;margin-right:2px;vertical-align:text-bottom}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.chat-input-zone{padding:1rem 1.5rem 1.3rem;border-top:1px solid var(--card-border);background:rgba(15,23,42,0.7)}.quick-chips{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.8rem}.quick-chip{background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-muted);border-radius:20px;padding:0.3rem 0.85rem;font-size:0.78rem;cursor:pointer;transition:all 0.2s;font-family:'Cairo',sans-serif}.quick-chip:hover{background:rgba(56,189,248,0.15);color:var(--accent-blue);border-color:var(--accent-blue)}.input-row{display:flex;gap:0.7rem;background:rgba(30,41,59,0.9);border:1px solid var(--card-border);border-radius:14px;padding:0.55rem;align-items:flex-end}.input-row:focus-within{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(56,189,248,0.15)}#userInput{flex:1;background:transparent;border:none;outline:none;color:var(--text-main);font-family:'Cairo',sans-serif;font-size:0.92rem;resize:none;max-height:140px;padding:0.5rem 0.4rem;line-height:1.6}#userInput::placeholder{color:rgba(203,213,225,0.4)}.btn-send{background:linear-gradient(135deg,#0284c7,#2563eb);border:none;color:#fff;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;transition:all 0.2s}.btn-send:disabled{opacity:0.45}.btn-send:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,0.5)}.btn-stop{background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.5);color:var(--accent-rose);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.input-meta{display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;font-size:0.72rem;color:rgba(203,213,225,0.55)}.char-count{direction:ltr}.welcome-hero{align-self:center;text-align:center;max-width:640px;margin:auto 0;padding:2rem 1rem}.welcome-hero .hero-icon{width:84px;height:84px;margin:0 auto 1.4rem;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#fff;box-shadow:0 12px 40px rgba(124,58,237,0.45)}.welcome-hero h2{font-weight:800;font-size:1.6rem;margin-bottom:0.6rem}.welcome-hero p{color:var(--text-muted);font-size:0.95rem;line-height:1.8;margin-bottom:1.5rem}.welcome-suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:0.7rem}.suggestion-card{background:rgba(30,41,59,0.7);border:1px solid var(--card-border);border-radius:12px;padding:0.9rem 1rem;text-align:right;cursor:pointer;transition:all 0.2s}.suggestion-card:hover{border-color:var(--accent-blue);background:rgba(56,189,248,0.08);transform:translateY(-2px)}.suggestion-card .s-title{font-weight:700;font-size:0.85rem;margin-bottom:0.25rem}.suggestion-card .s-desc{font-size:0.75rem;color:var(--text-muted);line-height:1.5}.error-box{background:rgba(244,63,94,0.12);border:1px solid rgba(244,63,94,0.35);border-radius:10px;padding:0.7rem 1rem;font-size:0.85rem;color:#fda4af}.retry-link{color:var(--accent-blue);cursor:pointer;text-decoration:underline}.btn-sidebar-toggle{background:rgba(255,255,255,0.07);border:1px solid var(--card-border);color:var(--text-muted);border-radius:8px;padding:0.35rem 0.6rem;font-size:0.9rem;cursor:pointer}@media (max-width:768px){.chat-sidebar{position:fixed;top:66px;bottom:0;z-index:1100;height:calc(100vh - 66px)}.chat-sidebar.hidden{margin-right:-270px}.msg-row.assistant{width:100%}.welcome-suggestions{grid-template-columns:1fr}.chat-messages{padding:1rem}.chat-input-zone{padding:0.8rem 1rem 1rem}.brand-sub{display:none}}</style>
</head>
<body>
<header class="top-header">
    <div class="brand-box">
        <button class="btn-sidebar-toggle" id="sidebarToggle" title="إظهار/إخفاء المحادثات"><i class="fa-solid fa-bars"></i></button>
        <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
        <div>
            <h1 class="brand-name">KHALED AI</h1>
            <p class="brand-sub">مساعد ذكي عربي — مجاني بالكامل</p>
        </div>
    </div>
    <div id="connIndicator" class="conn-indicator conn-checking">
        <span class="pulse-dot"></span>
        <span id="connText">جارٍ التحقق من الاتصال…</span>
    </div>
</header>
<div class="app-shell">
    <aside class="chat-sidebar" id="chatSidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" id="newChatBtn"><i class="fa-solid fa-plus me-2"></i>محادثة جديدة</button>
        </div>
        <div class="sessions-list" id="sessionsList"></div>
        <div class="sidebar-footer">
            <i class="fa-solid fa-circle-info me-1"></i>
            المحادثات محفوظة في متصفحك فقط
        </div>
    </aside>
    <main class="chat-main">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-zone">
            <div class="quick-chips" id="quickChips">
                <button class="quick-chip" data-prompt="اشرح لي الفرق بين الذكاء الاصطناعي والتعلم العميق بأسلوب مبسط">🧠 اشرح لي</button>
                <button class="quick-chip" data-prompt="اكتب لي كود بايثون يحلل ملف CSV ويرسم مخطط بياني للبيانات">💻 اكتب كود</button>
                <button class="quick-chip" data-prompt="اكتب لي قصيدة قصيرة عن الطموح والأمل">✍️ اكتب قصيدة</button>
                <button class="quick-chip" data-prompt="ساعدني في وضع خطة دراسة فعالة لمادة الرياضيات خلال شهر">📚 خطط معي</button>
            </div>
            <form id="chatForm">
                <div class="input-row">
                    <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا…" autocomplete="off"></textarea>
                    <button type="submit" class="btn-send" id="sendBtn" title="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </form>
            <div class="input-meta">
                <span><i class="fa-solid fa-shield-halved me-1"></i> محرك مجاني حقيقي — قد يتأخر الرد عند الضغط</span>
                <span class="char-count" id="charCount">0 / 4000</span>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script>
'use strict';
/* KHALED AI — Real free AI engine (text.pollinations.ai/openai)
   Honest errors: no fake fallback responses. Rate-limit aware with retries. */

const AI_ENDPOINT = 'https://text.pollinations.ai/openai';
const AI_MODEL = 'openai';
const MAX_INPUT_CHARS = 4000;
const HISTORY_LIMIT = 16;
const MAX_RETRIES = 3;
const SYSTEM_PROMPT = 'أنت "KHALED AI"، مساعد ذكي عربي محترف ودقيق. قواعدك: ' +
    '1) أجب بالعربية الفصحى الواضحة إلا إذا طلب المستخدم لغة أخرى أو كتب بالإنجليزية. ' +
    '2) كن دقيقًا وصادقًا: إذا لم تكن متأكدًا من معلومة فقل ذلك صراحة بدل التخمين. ' +
    '3) استخدم تنسيق Markdown: عناوين وقوائم وجداول وكتل كود عندما يساعد. ' +
    '4) في الأكواد البرمجية اذكر اسم اللغة، واكتب كودًا صحيحًا وقابلًا للتشغيل. ' +
    '5) كن عمليًا ومفيدًا ومختصرًا بدون حشو، واختم بخطوة تالية مقترحة عند الحاجة.';

const chatMessagesEl = document.getElementById('chatMessages');
const chatForm = document.getElementById('chatForm');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const charCountEl = document.getElementById('charCount');
const sessionsListEl = document.getElementById('sessionsList');
const newChatBtn = document.getElementById('newChatBtn');
const sidebarToggle = document.getElementById('sidebarToggle');
const chatSidebar = document.getElementById('chatSidebar');
const connIndicator = document.getElementById('connIndicator');
const connText = document.getElementById('connText');

marked.setOptions({ breaks: true, mangle: false, headerIds: false });

let sessions = [];
let activeSessionId = null;
let isGenerating = false;
let abortController = null;

try {
    sessions = JSON.parse(localStorage.getItem('khaled_sessions_v2')) || [];
    activeSessionId = localStorage.getItem('khaled_active_session_v2');
} catch { sessions = []; }
if (!Array.isArray(sessions)) sessions = [];
if (!sessions.length) createSession('محادثة جديدة', false);
if (!activeSessionId || !sessions.find(s => s.id === activeSessionId)) {
    activeSessionId = sessions[0].id;
}

function persist() {
    try {
        localStorage.setItem('khaled_sessions_v2', JSON.stringify(sessions.slice(0, 40)));
        localStorage.setItem('khaled_active_session_v2', activeSessionId);
    } catch {}
}
function currentSession() { return sessions.find(s => s.id === activeSessionId); }
function createSession(title, save = true) {
    const s = { id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        title: title || 'محادثة جديدة', messages: [], created: Date.now() };
    sessions.unshift(s); activeSessionId = s.id;
    if (save) { persist(); renderSessions(); renderMessages(); }
    return s;
}
function deleteSession(id) {
    sessions = sessions.filter(s => s.id !== id);
    if (activeSessionId === id) activeSessionId = sessions[0]?.id || null;
    if (!sessions.length) createSession('محادثة جديدة', false);
    persist(); renderSessions(); renderMessages();
}

function renderSessions() {
    sessionsListEl.innerHTML = '';
    sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
        div.innerHTML = '<i class="fa-regular fa-message" style="font-size:0.75rem;opacity:0.6"></i>' +
            '<span class="session-title"></span>' +
            '<button class="session-del" title="حذف"><i class="fa-solid fa-xmark"></i></button>';
        div.querySelector('.session-title').textContent = s.title;
        div.addEventListener('click', e => {
            if (e.target.closest('.session-del')) return;
            activeSessionId = s.id; persist(); renderSessions(); renderMessages();
            if (window.innerWidth <= 768) chatSidebar.classList.add('hidden');
        });
        div.querySelector('.session-del').addEventListener('click', () => deleteSession(s.id));
        sessionsListEl.appendChild(div);
    });
}

function buildWelcome() {
    const div = document.createElement('div');
    div.className = 'welcome-hero';
    div.innerHTML = '<div class="hero-icon"><i class="fa-solid fa-robot"></i></div>' +
        '<h2>أهلاً بك في KHALED AI 👋</h2>' +
        '<p>مساعد ذكي عربي حقيقي ومجاني بالكامل — بدون تسجيل وبدون مفاتيح. اسأل عن أي شيء: برمجة، شعر، دراسة، ترجمة، أفكار، وأكثر.</p>' +
        '<div class="welcome-suggestions">' +
        '<div class="suggestion-card" data-prompt="اشرح لي الفرق بين الذكاء الاصطناعي والتعلم العميق بأسلوب مبسط"><div class="s-title"><i class="fa-solid fa-brain me-2"></i>اشرح لي</div><div class="s-desc">الفرق بين الذكاء الاصطناعي والتعلم العميق</div></div>' +
        '<div class="suggestion-card" data-prompt="اكتب لي كود بايثون يحلل ملف CSV ويرسم مخطط بياني للبيانات"><div class="s-title"><i class="fa-solid fa-code me-2"></i>اكتب كود</div><div class="s-desc">تحليل بيانات CSV برسوم بيانية بلغة بايثون</div></div>' +
        '<div class="suggestion-card" data-prompt="اكتب لي قصيدة قصيرة عن الطموح والأمل"><div class="s-title"><i class="fa-solid fa-feather me-2"></i>اكتب قصيدة</div><div class="s-desc">قصيدة عربية قصيرة عن الطموح والأمل</div></div>' +
        '<div class="suggestion-card" data-prompt="ساعدني في وضع خطة دراسة فعالة لمادة الرياضيات خلال شهر"><div class="s-title"><i class="fa-solid fa-graduation-cap me-2"></i>خطط معي</div><div class="s-desc">خطة دراسة عملية لمادة الرياضيات في شهر</div></div>' +
        '</div>';
    div.querySelectorAll('.suggestion-card').forEach(c => {
        c.addEventListener('click', () => sendMessage(c.dataset.prompt));
    });
    return div;
}

function renderMessages() {
    chatMessagesEl.innerHTML = '';
    const s = currentSession();
    if (!s || s.messages.length === 0) {
        chatMessagesEl.appendChild(buildWelcome());
    } else {
        s.messages.forEach(m => appendMessage(m.role, m.content, { animate: false }));
        scrollToBottom(false);
    }
}

function appendMessage(role, content, opts = {}) {
    const existing = chatMessagesEl.querySelector('.welcome-hero');
    if (existing) existing.remove();
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    row.innerHTML = '<div class="avatar-box ' + (role === 'user' ? 'avatar-user' : 'avatar-ai') + '">' +
        '<i class="fa-solid ' + (role === 'user' ? 'fa-user' : 'fa-robot') + '"></i></div>' +
        '<div class="msg-body"><div class="msg-sender">' + (role === 'user' ? 'أنت' : 'KHALED AI') + '</div>' +
        '<div class="msg-bubble"></div></div>';
    const bubble = row.querySelector('.msg-bubble');
    if (opts.raw) { bubble.innerHTML = content; }
    else {
        bubble.innerHTML = renderMarkdown(content);
        enhanceCodeBlocks(bubble);
    }
    if (!opts.animate) row.style.animation = 'none';
    chatMessagesEl.appendChild(row);
    if (opts.scroll !== false) scrollToBottom();
    return { row, bubble };
}

function renderMarkdown(text) {
    try { return marked.parse(text); }
    catch { return escapeHtmlText(text).replace(/\n/g, '<br>'); }
}
function enhanceCodeBlocks(container) {
    container.querySelectorAll('pre code').forEach(block => {
        try { hljs.highlightElement(block); } catch {}
        const pre = block.parentElement;
        if (pre.querySelector('.code-copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'code-copy-btn'; btn.textContent = 'نسخ';
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(block.textContent).then(() => {
                btn.textContent = 'تم النسخ ✓';
                setTimeout(() => btn.textContent = 'نسخ', 1500);
            }).catch(() => {});
        });
        pre.appendChild(btn);
    });
}
function escapeHtmlText(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scrollToBottom(smooth = true) {
    chatMessagesEl.scrollTo({ top: chatMessagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

class AIError extends Error {
    constructor(status, message) { super(message); this.status = status; }
}

function friendlyError(err) {
    if (err.name === 'AbortError') return 'تم إيقاف الرد.';
    if (err.status === 429) return 'الخدمة مشغولة حاليًا (الخدمة المجانية تسمح بطلب واحد في نفس اللحظة لكل مستخدم). انتظر قليلًا ثم أعد المحاولة.';
    if (err.status === 503 || err.status === 502) return 'الخادم غير متاح مؤقتًا. أعد المحاولة بعد لحظات.';
    if (String(err.message).includes('Failed to fetch') || String(err.message).includes('NetworkError'))
        return 'تعذر الاتصال بالإنترنت أو بالخادم. تحقق من اتصالك وأعد المحاولة.';
    return err.message || 'حدث خطأ غير متوقع.';
}

function isErrorLike(text) {
    const t = text.slice(0, 300).toLowerCase();
    return t.includes('reached its budget') ||
           t.includes('api key used for this request') ||
           t.includes('budget limit') ||
           t.includes('rate limit') && t.includes('pollinations');
}

async function fetchAI(messages, signal, onChunk) {
    const body = JSON.stringify({
        model: AI_MODEL,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages],
        stream: !!onChunk
    });
    let attempt = 0;
    while (true) {
        attempt++;
        const resp = await fetch(AI_ENDPOINT, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body, signal
        });
        if (resp.ok) {
            if (onChunk) return streamResponse(resp, onChunk);
            const data = await resp.json().catch(() => null);
            const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (!text || !text.trim()) throw new AIError(0, 'وصل رد فارغ من المحرك. أعد المحاولة.');
            if (isErrorLike(text)) throw new AIError(429, 'الخدمة مشغولة حاليًا (حصة الاستخدام المؤقتة). أعد المحاولة بعد لحظات.');
            return text.trim();
        }
        let errMsg = 'HTTP ' + resp.status;
        try {
            const j = await resp.json();
            if (j.error) errMsg = typeof j.error === 'string' ? j.error : (j.error.message || errMsg);
        } catch {}
        const retryable = resp.status === 429 || resp.status === 502 || resp.status === 503 || resp.status === 504;
        if (retryable && attempt <= MAX_RETRIES) {
            await new Promise(r => setTimeout(r, 2000 * attempt));
            continue;
        }
        throw new AIError(resp.status, errMsg);
    }
}

async function streamResponse(resp, onChunk) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let full = '', buffer = '';
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
            const t = line.trim();
            if (!t.startsWith('data:')) continue;
            const payload = t.slice(5).trim();
            if (payload === '[DONE]') continue;
            try {
                const j = JSON.parse(payload);
                const piece = (j.choices && j.choices[0] && ((j.choices[0].delta && j.choices[0].delta.content) || (j.choices[0].message && j.choices[0].message.content))) || '';
                if (piece) { full += piece; onChunk(full); }
            } catch {}
        }
    }
    if (!full.trim()) throw new AIError(0, 'انتهى البث بدون محتوى. أعد المحاولة.');
    if (isErrorLike(full)) throw new AIError(429, 'الخدمة مشغولة حاليًا (حصة الاستخدام المؤقتة). أعد المحاولة بعد لحظات.');
    return full.trim();
}

async function sendMessage(text) {
    if (isGenerating) return;
    const prompt = (text !== undefined ? text : userInput.value).trim();
    if (!prompt) return;
    if (prompt.length > MAX_INPUT_CHARS) {
        alert('النص طويل جدًا (الحد ' + MAX_INPUT_CHARS + ' حرفًا). اختصره أو قسّمه.');
        return;
    }
    const s = currentSession() || createSession('محادثة');
    isGenerating = true;
    abortController = new AbortController();
    setGeneratingUI(true);

    s.messages.push({ role: 'user', content: prompt });
    if (s.messages.length === 1) s.title = prompt.slice(0, 40) + (prompt.length > 40 ? '…' : '');
    appendMessage('user', prompt);
    userInput.value = ''; updateCharCount();
    userInput.style.height = 'auto';
    persist(); renderSessions();

    const assistantEls = appendMessage('assistant', '', { raw: true });
    const bubble = assistantEls.bubble;
    bubble.innerHTML = '<span class="typing-cursor"></span><span style="color:var(--text-muted);font-size:0.85rem"> يفكر…</span>';

    const context = s.messages.slice(-HISTORY_LIMIT).map(m => ({ role: m.role, content: m.content }));

    try {
        const full = await fetchAI(context, abortController.signal, (partial) => {
            bubble.innerHTML = renderMarkdown(partial) + '<span class="typing-cursor"></span>';
            enhanceCodeBlocks(bubble);
            scrollToBottom(false);
        });
        bubble.innerHTML = renderMarkdown(full);
        enhanceCodeBlocks(bubble);
        s.messages.push({ role: 'assistant', content: full });
        persist();
        scrollToBottom();
    } catch (err) {
        if (err.name === 'AbortError') {
            bubble.innerHTML = '<div class="error-box">⏹ تم إيقاف توليد الرد.</div>';
        } else {
            const msg = escapeHtmlText(friendlyError(err));
            bubble.innerHTML = '<div class="error-box"><strong>تعذر الحصول على رد:</strong> ' + msg +
                '<br><span class="retry-link">↻ أعد المحاولة</span></div>';
            const retry = bubble.querySelector('.retry-link');
            if (retry) retry.addEventListener('click', () => {
                bubble.closest('.msg-row').remove();
                s.messages.pop();
                persist();
                isGenerating = false; abortController = null; setGeneratingUI(false);
                sendMessage(prompt);
            });
        }
    } finally {
        isGenerating = false;
        abortController = null;
        setGeneratingUI(false);
    }
}

function setGeneratingUI(generating) {
    sendBtn.disabled = generating;
    if (generating) {
        sendBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
        sendBtn.classList.remove('btn-send');
        sendBtn.classList.add('btn-stop');
        sendBtn.onclick = (e) => { e.preventDefault(); if (abortController) abortController.abort(); };
    } else {
        sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
        sendBtn.classList.add('btn-send');
        sendBtn.classList.remove('btn-stop');
        sendBtn.onclick = null;
    }
}

async function checkConnection() {
    connIndicator.className = 'conn-indicator conn-checking';
    connText.textContent = 'جارٍ التحقق من الاتصال…';
    try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 12000);
        const resp = await fetch(AI_ENDPOINT, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: AI_MODEL, messages: [{ role: 'user', content: 'ping' }], max_tokens: 1 }),
            signal: ctrl.signal
        });
        clearTimeout(t);
        if (resp.ok || resp.status === 429) {
            connIndicator.className = 'conn-indicator conn-ok';
            connText.textContent = 'المحرك متصل ويعمل';
        } else { throw new Error(); }
    } catch {
        connIndicator.className = 'conn-indicator conn-bad';
        connText.textContent = 'تعذر الوصول للمحرك';
    }
}

function updateCharCount() { charCountEl.textContent = userInput.value.length + ' / ' + MAX_INPUT_CHARS; }

userInput.addEventListener('input', () => {
    updateCharCount();
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
});
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatForm.dispatchEvent(new Event('submit')); }
});
chatForm.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });
document.getElementById('quickChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.quick-chip');
    if (!chip) return;
    userInput.value = chip.dataset.prompt;
    userInput.focus(); updateCharCount();
});
newChatBtn.addEventListener('click', () => {
    createSession('محادثة جديدة');
    if (window.innerWidth <= 768) chatSidebar.classList.add('hidden');
});
sidebarToggle.addEventListener('click', () => { chatSidebar.classList.toggle('hidden'); });

renderSessions();
renderMessages();
updateCharCount();
checkConnection();
setInterval(checkConnection, 5 * 60 * 1000);
</script>
